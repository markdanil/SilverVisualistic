name: Build and publish SilverVisualistic

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | sort | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No remapped mod JAR found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$JAR_PATH" "dist/SilverVisualistic-${VERSION}.jar"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git archive --format=zip --output="dist/SilverVisualistic-${VERSION}-source.zip" HEAD
          fi
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilverVisualistic-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SilverVisualistic ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.jar
            dist/*-source.zip
          generate_release_notes: true
